<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard RSVP - LFK x Arkiv</title>
    <meta name="description" content="Dashboard admin untuk mengelola data kehadiran tamu undangan">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png">
    <link rel="manifest" href="/img/favicon/site.webmanifest">
    <link rel="shortcut icon" href="/img/favicon/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Login Container -->
    <div id="login-container" class="login-wrapper">
        <div class="glass-panel login-panel">
            <div class="login-header">
                <div class="login-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <h1>Login Admin</h1>
                <p class="subtitle">Silakan otentikasi untuk mengakses data peserta</p>
            </div>
            <form id="form-login">
                <div class="form-group">
                    <label for="input-email">Email Address</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <input type="email" id="input-email" required placeholder="admin@famindo.com">
                    </div>
                </div>
                <div class="form-group">
                    <label for="input-password">Password</label>
                    <div class="input-with-icon">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <input type="password" id="input-password" required placeholder="••••••••">
                    </div>
                </div>
                <div id="login-error" class="hidden login-error-msg"></div>
                <button type="submit" class="btn btn-login w-100" id="btn-login">
                    <span>Masuk ke Dashboard</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="main-app" class="app-container hidden">
        <!-- Header & Stats -->
        <header class="glass-panel">
            <div class="header-content">
                <div>
                    <h1>Follow Up Kehadiran</h1>
                    <p class="subtitle">Kelola konfirmasi peserta via WhatsApp</p>
                </div>
                <button id="btn-logout" class="btn btn-outline" style="height: fit-content;">Logout</button>
            </div>
            <div class="stats-container">
                <div class="stat-box">
                    <span class="stat-label">Total</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
                <div class="stat-box primary">
                    <span class="stat-label">Hadir</span>
                    <span class="stat-value" id="stat-attend">0</span>
                </div>
                <div class="stat-box danger">
                    <span class="stat-label">Tidak Hadir</span>
                    <span class="stat-value" id="stat-absent">0</span>
                </div>
            </div>
        </header>

        <div class="main-grid">

            <!-- Right Column: Data Table -->
            <div class="right-column">
                <section class="glass-panel section-panel h-100">
                    <div class="table-header">
                        <h2>Daftar Kontak</h2>
                        <div class="table-actions">
                            <input type="text" id="search-input" placeholder="Cari nama / no. HP..."
                                class="search-input">
                            <select id="filter-status" class="filter-select">
                                <option value="semua">Semua Kehadiran</option>
                                <option value="belum">Belum Konfirmasi</option>
                                <option value="hadir">Hadir</option>
                                <option value="tidak">Tidak Hadir</option>
                            </select>
                            <button id="btn-export" class="btn btn-outline">Export CSV</button>
                            <button id="btn-print" class="btn btn-primary">Print PDF</button>
                        </div>
                    </div>

                    <div class="table-responsive">
                        <table id="contacts-table">
                            <thead>
                                <tr>
                                    <th class="sortable" data-sort="nama">Nama <span class="sort-icon"></span></th>
                                    <th class="sortable" data-sort="statusHadir">Kehadiran <span
                                            class="sort-icon"></span></th>
                                    <th class="sortable" data-sort="jumlahOrang">Jumlah Orang <span
                                            class="sort-icon"></span></th>
                                    <th class="no-print">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <!-- Data rows will be injected here via TS -->
                            </tbody>
                        </table>
                        <div id="empty-state" class="empty-state hidden">
                            <p>Belum ada data kontak atau tidak ada yang cocok dengan pencarian.</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <script type="module" src="/src/app.ts"></script>
</body>

</html>
