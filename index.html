<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Kehadiran - LFK x Arkiv</title>
    <meta name="description" content="Konfirmasi kehadiran Anda untuk acara LFK x Arkiv">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/img/favicon/favicon-16x16.png">
    <link rel="manifest" href="/img/favicon/site.webmanifest">
    <link rel="shortcut icon" href="/img/favicon/favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Smoke Background Effect -->
    <div class="smoke-layer">
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
        <div class="smoke-particle"></div>
    </div>

    <div class="rsvp-container">
        <!-- Loader / Skeleton while fetching data -->
        <div id="loader" class="loader-container">
            <div class="spinner"></div>
            <p>Memuat data...</p>
        </div>

        <!-- Main Form -->
        <div id="rsvp-form-container" class="glass-panel hidden">
            <div class="header">
                <div class="logo-wrapper">
                    <img src="/img/Zen 1 x LFK.png" alt="LFK x Arkiv" class="event-logo">
                </div>
                <h1>Konfirmasi Kehadiran</h1>
                <p class="subtitle">Kami menantikan kehadiran Anda di acara kami!</p>
            </div>

            <form id="rsvp-form">
                <div class="form-group">
                    <label for="input-nama">Nama Lengkap</label>
                    <input type="text" id="input-nama" required placeholder="Masukkan nama Anda">
                </div>

                <div class="form-group">
                    <label for="input-jumlah">Jumlah Orang yang Hadir</label>
                    <input type="number" id="input-jumlah" min="1" max="10" required placeholder="Contoh: 2">
                </div>

                <div class="form-group status-group">
                    <label>Apakah Anda akan hadir?</label>
                    <div class="button-group">
                        <button type="button" class="btn-status btn-hadir" data-status="hadir">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                <polyline points="22 4 12 14.01 9 11.01"></polyline>
                            </svg>
                            Saya Akan Hadir
                        </button>
                        <button type="button" class="btn-status btn-tidak" data-status="tidak">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="15" y1="9" x2="9" y2="15"></line>
                                <line x1="9" y1="9" x2="15" y2="15"></line>
                            </svg>
                            Maaf, Tidak Bisa Hadir
                        </button>
                    </div>
                    <input type="hidden" id="input-status">
                    <div id="status-error" class="error-msg hidden">Pilih salah satu status kehadiran di atas.</div>
                </div>

                <button type="submit" class="btn-submit" id="btn-submit">
                    Kirim Konfirmasi
                </button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="success-container" class="glass-panel hidden text-center">
            <div class="logo-wrapper">
                <img src="/img/Zen 1 x LFK.png" alt="LFK x Arkiv" class="event-logo">
            </div>
            <div class="success-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
            </div>
            <h2>Terima Kasih!</h2>
            <p id="success-msg">Konfirmasi kehadiran Anda telah kami terima.</p>
        </div>
    </div>

    <script type="module" src="/src/rsvp.ts"></script>
</body>

</html>
